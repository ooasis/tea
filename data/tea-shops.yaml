    notes: Listed under "Tea Only" in TeaForum's vendor thread. Site states the parent producer was established in Wuyi Mountains in 2001 and that it is officially authorized, which is a stronger provenance claim than most resellers make - worth confirming on a first order. Local Ontario stock means no China customs wait for North American buyers. HTTP 200.
  - name: Kong Mountain Tea
    url: https://www.kongmountaintea.com
    specialty: Region-led Chinese selection (Wuyi, Feng Huang, Yunnan, Fuding white, Jiangnan greens and jasmine) with studio teaware, tea sommelier classes and origin trips
    ships_from: US (Cambridge, MA)
    status: candidate
    added: 2026-10-01
    notes: Named in TeaForum's "Tea and Teaware" vendor list. Has a physical storefront at 1132 Massachusetts Ave, Cambridge MA, which makes it a rare East Coast option for tasting before buying. Organizes classes, workshops and tea trips to China alongside retail. HTTP 200.
  - name: TenFu's Tea (天福茗茶)
    url: https://tea-tao.com
    specialty: Full-range Chinese tea from self-owned gardens across eight provinces, with a deep green tea line (Taihu Biluochun, first-flush Longjing)
    ships_from: China
    status: candidate
    added: 2026-10-02
    notes: English storefront of Ten Fu Group, founded 1993 and ranked first among China's top 100 tea companies 2013-2017, with over 1,200 retail stores in mainland China. Vertically integrated - own gardens, no middleman - which is unusual at this scale and means consistent supply rather than small-lot scarcity. Expect a large-brand catalog rather than single-farm lots. Free shipping over $59. HTTP 200.
  - name: Oriarm
    url: https://oriarm.com
    specialty: Chinese tea and teaware generalist with well-documented green tea listings (pre-Qingming Longjing, Anji Bai Cha) carrying explicit harvest dates and grades
    ships_from: China
    status: candidate
    added: 2026-10-02
    notes: Listings state specific harvest windows (e.g. "2026 Longjing Pre-QingMing 1st Grade, harvested March 20-25, 2026") and name the province down to the production area, which is the kind of disclosure worth checking a green tea vendor for. Also widely sold on Amazon as "oriarmcha" - the direct site carries the fuller catalog. No organic or fair-trade certification claims. HTTP 200.
  - name: GOARTEA
    url: https://www.goartea.com
    specialty: Broad loose-leaf Chinese tea catalog with strong regional green coverage (Xihu Longjing, Suzhou Biluochun, Xinyang Maojian, Emei Zhuyeqing) plus teaware
    ships_from: China (Guangzhou)
    status: candidate
    added: 2026-10-02
    notes: Long-running marketplace seller (eBay/Amazon) that also runs its own storefront. Grading language leans on "Supreme" and "Nonpareil" rather than documented sourcing, so provenance is thinner than Oriarm or One River - useful mainly for breadth and price on named green varieties. Worldwide shipping quoted at 11-24 days. HTTP 200.
  - name: Jesse's Teahouse
    url: https://jessesteahouse.com
    specialty: Gongfu-focused Chinese whole leaf tea (pu'er, red, white, oolong) plus tea pets, tea tables and brewing equipment
    ships_from: US (Los Angeles, CA)
    status: candidate
    added: 2026-10-03
    notes: Founded 2021 by Jesse Appell, an American who spent nine years in China; the catalog is built around named farmer partners (Duidui, a 30-year industry veteran; Sister Ai, a 4th-generation farmer) rather than anonymous grades. Education-forward - the shop exists alongside a gongfu-culture video channel - so useful for a beginner who wants the why with the leaf. Has expanded to warehouses in Canada, the EU and the UK. HTTP 200.
  - name: JIN YUN FU
    url: https://www.jinyunfuteashop.com
    specialty: Single-origin loose-leaf Chinese tea with curated teaware and in-person tea service
    ships_from: US (New York, NY)
    status: candidate
    added: 2026-10-03
    notes: Brick-and-mortar shop at 12 W 29th St in Manhattan, founded 1995, selling online alongside the storefront - a rare East Coast option for tasting before buying. Small operation (closed Tuesdays except by reservation), so expect a curated rather than broad catalog. Site does not break out which varieties it specializes in; worth a visit-and-taste before an online order. HTTP 200.
  - name: Pu-Erh & Palms
    url: https://www.chinese-tea.la
    specialty: Small curated Chinese selection - milk oolong, Sparrow Tongue green, Da Hong Pao, flower teas - plus in-person tea ceremony sessions
    ships_from: US (Los Angeles, CA)
    status: candidate
    added: 2026-10-03
    notes: Owner-operated (Elena) micro-shop pairing retail with LA tea-ceremony experiences. Pricing starts around $15/oz and the site credits "the finest suppliers" without naming farms or gardens, so provenance disclosure is thinner than Jesse's Teahouse or Tea Drunk. Best read as a local-experience vendor first, mail-order source second. HTTP 200.
  - name: Xizi Hao
    url: https://www.xizihaotea.com
    specialty: High-end boutique pu-erh pressed under the Xizihao label, catalogued by vintage (2014-2024), plus ripe tea, samples and teaware
    ships_from: Taiwan (Tainan)
    status: candidate
    added: 2026-10-04
    notes: Long-running boutique producer rather than a reseller - cakes are its own pressings, with wrapper art commissioned from calligraphers. Still active, a buy-one-get-one on new Chawangbing was running and 2024 Yun Tai 8582 had just landed when checked. Site does not state its location; Tainan base is per TeaDB's non-mainland vendor guide, not the shop's own copy. Expect boutique pricing and small lots. HTTP 200.
  - name: Quiche Teas
    url: https://quicheteas.com
    specialty: Taiwan-stored factory pu-erh - Dayi, Xiaguan, Mengku Rongshi - sourced via Taishunhe, alongside oolong, heicha, white and green
    ships_from: Taiwan
    status: candidate
    added: 2026-10-04
    notes: Factory-tea specialist rather than a gushu curator, which makes it a cheaper route into aged sheng than the boutique vendors; samples sit well under $10 and premium aged cakes run past $100. Storage provenance (Taiwan, via Taishunhe) is the selling point, so verify the storage claim on a given cake before paying up. Location not stated on site; Taiwan base is per TeaDB. HTTP 200.
  - name: Puerh Guy
    url: https://www.puerhguy.com
    specialty: Pu-erh only - boutique and factory cakes, weighted toward semi-aged
    ships_from: UK
    status: candidate
    added: 2026-10-04
    notes: Tagline is "Authentic puerh tea. Buy the leaves, not the stories," and the catalog is narrow by design - a single-category vendor, not a general Chinese tea shop. UK base confirmed from the site's own footer. A useful European-stock alternative to Essence of Tea or Tea Encounter; US buyers should price transatlantic shipping before committing. HTTP 200.
  - name: Music City Tea
    url: https://musiccitytea.com
    specialty: Wuyi yancha and gongfu teaware - a US bricks-and-mortar shop with a mid-fired rock oolong reputation
    ships_from: US (Murfreesboro, Tennessee)
    status: candidate
    added: 2026-10-05
    notes: TeaDB's Wuyi vendor guide names it alongside JK Tea Shop as a mid-range source for properly mid-fired, smooth yancha. Roughly 20 oolongs, with genuine Wuyi names (Da Hong Pao, Shui Xian, Rougui) plus Dong Ding and Tieguanyin; no Dan Cong. Caveat - the catalog also carries flavored/chai and fruit tea, so it is a mixed retailer rather than a pure specialist. Also stocks Yixing pots, gaiwans and tea trays. HTTP 200.
  - name: Valley of Tea
    url: https://www.valleyoftea.com
    specialty: Single-origin unflavored teas with a long-running direct Anxi Tieguanyin line
    ships_from: Belgium (Oostkamp)
    status: candidate
    added: 2026-10-05
    notes: Claims fifteen-plus years sourcing Tieguanyin directly from multi-generational family producers in higher-elevation Anxi villages that hand-pick and process their own leaf. Site-wide position is "no added flavours," single-origin only. European warehouse, so a stock alternative for EU buyers; US buyers should price shipping first. HTTP 200.
  - name: Living Roots
    url: https://www.livingrootsusa.com
    specialty: Taiwan high-mountain oolong, farm-direct and farm-traceable, alongside Japanese tea
    ships_from: US (Sacramento, California)
    status: candidate
    added: 2026-10-05
    notes: Single-origin only, sourced from family growers the owners say they visit personally; the Alishan high-mountain oolong comes from one family-run garden. Not a China-only shop - the range spans Taiwan, Japan and India, so it is narrower on mainland Chinese tea than most of this ledger. Free US shipping over $49. HTTP 200.
  - name: Serene Tea Studio
    url: https://serenetea-cha.com
    specialty: Farm-direct Chinese loose leaf from named individual growers; Fuding white, Phoenix Dancong, Wuyi rock oolong
    ships_from: US (Seattle, Washington)
    status: candidate
    added: 2026-10-06
    notes: Unusually explicit farm-direct model - a public "Meet Our Farmers" page names each grower behind a tea (Bei Bei Zhang for Lapsang Souchong, Farmer Liu and Xie Xin Xu for Dancong, Farmer Wen for white tea, Farmer Luo for Yunnan red). No blends or flavourings; some Taiwan and Thai wild tea alongside the Chinese range. Also stocks gaiwans and cups. HTTP 200.
  - name: Silk Road Teas
    url: https://silkroadteas.com
    specialty: Single-origin seasonal Chinese tea, strong pre-Qingming spring greens; some organic certification
    ships_from: US (San Francisco Bay Area, California)
    status: candidate
    added: 2026-10-06
    notes: Family owned and operated since 1992, so one of the longer-running US direct importers. Says it travels China annually to buy from small farms, farm cooperatives and regional tea markets rather than a single importer. China-only range plus a little teaware. Also sold through Bay Area grocers, which makes it easy to taste before ordering online. HTTP 200.
  - name: Rishi Tea
    url: https://www.rishi-tea.com
    specialty: Direct-trade organic Chinese tea; maintains a distinct "Garden Direct Teas from China" line
    ships_from: US (Milwaukee, Wisconsin)
    status: candidate
    added: 2026-10-06
    notes: Larger and more mainstream than most of this ledger - it does sell flavoured blends and tea bags - but the garden-direct Chinese collection is genuine single-origin direct trade with organic certification, and it publishes harvest reporting from Fujian. Treat the garden-direct line as the part worth reviewing, not the catalogue as a whole. HTTP 200.
  - name: HOJO Tea
    url: https://hojotea.com/en/
    specialty: Origin-selected Chinese pu-erh, oolong, Dancong and white tea alongside natural-clay teapots
    ships_from: Malaysia (Kuala Lumpur) and Japan (Nagano)
    status: candidate
    added: 2026-10-07
    notes: Run by Akira Hojo, who trained in agricultural chemistry and food science and buys at origin in China, Taiwan and Japan. The teaware side is unusually opinionated - pots are selected for unglazed natural clay and its effect on the brew rather than for decoration - which makes this the rare shop where the tea and the pot are argued as one system. Mixed Japanese and Chinese catalogue, so the Chinese range is narrower than a China-only vendor, and forum reports note slow replies to email. HTTP 200.
  - name: Cha Zhi Ji
    url: https://chazhijitea.com
    specialty: Aged and rare Chinese tea (Wuyi yancha, Liu Bao, sheng and shou pu-erh) paired with Yixing and antique teaware
    ships_from: Malaysia
    status: candidate
    added: 2026-10-07
    notes: Founded 1995, so one of the longest-running sellers in this ledger, operating as The Fine Cup Enterprise. Both halves of the catalogue aim at collectors - antique teacups and Yixing pots next to aged dark tea - and free shipping only kicks in above USD 1,500, which signals the price tier. Useful as a reference point for aged tea and antique ware, less so for everyday buying. HTTP 200.
  - name: Fong's Tea
    url: https://www.fongstea.com
    specialty: Pu-erh and oolong bought direct from Chinese tea regions, with Yixing teapots and gaiwans
    ships_from: Not stated on site
    status: candidate
    added: 2026-10-07
    notes: The most tea-led of this run's teaware-plus-tea finds - a real dated pu-erh catalogue (2018 Fu Jin raw cake, 2012 Da Yi Sun Ke Qing Zhuan) and a tea club, with teaware as the companion rather than the main act. Says it travels to Chinese tea regions yearly and buys from farmers directly, but names no owner, no founding date and no shipping origin, so verify lead times before ordering. HTTP 200.
